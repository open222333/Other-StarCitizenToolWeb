services:
  web:
    # multi-stage build（見 docker/Dockerfile.web）：容器內自動跑 npm run build:web，
    # 不需要在本機手動 build，`docker-compose up --build` 就會產生最新的靜態檔。
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    image: sc-tool-web:latest
    hostname: flask-api-web
    # 預設只綁 127.0.0.1——理由同 docker-compose.db.yml 的 DB_BIND_HOST：
    # Docker 的 port 發佈會直接寫 iptables、繞過 ufw，寫死 0.0.0.0 等於
    # 只要主機有公網 IP 就對外開放。要繞過前面的 nginx/反向代理直接對外
    # 才需要改成 0.0.0.0，一般透過主機 nginx 反代時不需要。
    ports:
      - "${WEB_BIND_HOST:-127.0.0.1}:${WEB_PORT:-8090}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64m
