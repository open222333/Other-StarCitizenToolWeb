services:
  bot:
    # 容器 log 上限（docs/現版本優化方案.md 0-5）：每個檔 10MB、最多 3 個，不會無限長大塞滿硬碟
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    profiles: ["background"]
    # 沿用 api 的 image（bot/ 與 src/ 都在裡面），不必另外建置
    image: python-flask-api:latest
    hostname: sc-tool-bot
    command: python -m bot.main
    env_file: .env
    volumes:
      - ./src:/app/src
      - ./bot:/app/bot
      - ./conf:/app/conf
      - ./logs:/app/logs
    depends_on:
      mongo:
        condition: service_healthy
    # 健康檢查：連上 Discord 後每 30 秒寫心跳檔，3 分鐘沒更新就不健康（bot/health.py）
    healthcheck:
      test: ["CMD", "python", "-m", "bot.health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s
    restart: unless-stopped
