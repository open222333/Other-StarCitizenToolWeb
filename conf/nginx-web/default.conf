# ============================================================
# web 容器（規格書第 17 節「前端技術架構」）：
# 服務 frontend/dist-web（`npm run build:web` 的輸出），SPA fallback，
# API 路徑（/auth、/user、/player、/blueprint、/item、/inventory ...）轉發給 api 容器。
# ⚠️ 這串前綴的單一事實來源是 frontend/vite.api-prefixes.mjs 的 API_PREFIXES，
#    新增 Flask blueprint 時兩邊要一起改（漏改的症狀是無聲的：那個前綴會落到
#    下面的 SPA fallback，前端拿到 index.html 卻以為是 JSON）。
# ============================================================
server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20M;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # ── 還原真實訪客 IP ─────────────────────────────────────────
    # 這個容器前面還有一層反向代理（主機 nginx，經 Docker 網路連進來，來源是 Docker 閘道
    # 172.x）。只信任 Docker 私有網段送來的 X-Forwarded-For，從右往左跳過可信的代理，取第一個
    # 不可信的位址當訪客 IP（recursive）——這樣 $remote_addr、下面轉給 api 的 X-Real-IP／
    # X-Forwarded-For 才是訪客本人，api 的 ProxyFix(x_for=1)、登入失敗鎖定、操作紀錄 IP、
    # 限流才不會全站共用一個 IP。外部直接連進來的請求來源是公網 IP（不在信任範圍），
    # 自己帶的 X-Forwarded-For 不會被採信。
    # ⚠️ Docker 若關掉 iptables、改用 userland-proxy 對外發佈這個埠，所有外部連線的來源都會變成
    #    閘道 IP，這時不要讓這個容器直接對外（WEB_BIND_HOST 維持 127.0.0.1，前面一定要有反向代理）。
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # ── 靜態資源（帶 hash 檔名，可長期快取）──────────────────────
    # 只用一個 add_header 而不是 `expires 30d` + add_header：那樣會送出兩行
    # Cache-Control，雖然 RFC 允許合併，但不同代理／瀏覽器的處理不一致，
    # 一行講清楚比較好。內容變了檔名的 hash 就會變，所以 immutable 是安全的。
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # ── API 反向代理到 api 容器 ───────────────────────────────────
    #    ⚠️ 前端頁面的網址也可能剛好用到這些前綴（例如 /data 資料庫檢視、/mining、/inventory），
    #    在那種頁面按重新整理，瀏覽器是「整頁導覽」（Sec-Fetch-Mode: navigate），要回 index.html
    #    交給 vue-router，不能轉給 api（不然會看到 Flask 的 404 JSON）；前端的 fetch 不是 navigate，照常轉發。
    location ~ ^/(auth|user|log|device|player|blueprint|item|inventory|mining|links|mission|starmap|data)(/|$) {
        if ($http_sec_fetch_mode = "navigate") {
            rewrite ^ /index.html last;
        }
        proxy_pass         http://api:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── SPA fallback：其餘路徑一律回傳 index.html，交給 vue-router 處理 ──
    #
    # index.html 一定要 no-store。它是唯一指向 /assets/ 那些 hash 檔名的入口，
    # 而上面的 /assets/ 是 immutable 30 天 —— 一旦瀏覽器快取了舊的 index.html，
    # 重新 build image 也沒用，使用者會一直載到舊的 chunk（或舊 chunk 已被
    # 新 image 刪掉而變成 404 白畫面）。這是「改了程式卻看不到變化」最常見的原因。
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    location /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
