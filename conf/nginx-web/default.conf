# ============================================================
# web 容器（規格書第 17 節「前端技術架構」）：
# 服務 frontend/dist-web（`npm run build:web` 的輸出），SPA fallback，
# API 路徑（/auth、/user、/player、/blueprint、/item、/inventory ...）轉發給 api 容器。
# ⚠️ 這串前綴的單一事實來源是 frontend/vite.api-prefixes.mjs 的 API_PREFIXES，
#    新增 Flask blueprint 時兩邊要一起改（漏改的症狀是無聲的：那個前綴會落到
#    下面的 SPA fallback，前端拿到 index.html 卻以為是 JSON）。
# ============================================================
server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20M;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # ── 靜態資源（帶 hash 檔名，可長期快取）──────────────────────
    # 只用一個 add_header 而不是 `expires 30d` + add_header：那樣會送出兩行
    # Cache-Control，雖然 RFC 允許合併，但不同代理／瀏覽器的處理不一致，
    # 一行講清楚比較好。內容變了檔名的 hash 就會變，所以 immutable 是安全的。
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # ── API 反向代理到 api 容器 ───────────────────────────────────
    location ~ ^/(auth|user|log|device|player|blueprint|item|inventory)(/|$) {
        proxy_pass         http://api:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── SPA fallback：其餘路徑一律回傳 index.html，交給 vue-router 處理 ──
    #
    # index.html 一定要 no-store。它是唯一指向 /assets/ 那些 hash 檔名的入口，
    # 而上面的 /assets/ 是 immutable 30 天 —— 一旦瀏覽器快取了舊的 index.html，
    # 重新 build image 也沒用，使用者會一直載到舊的 chunk（或舊 chunk 已被
    # 新 image 刪掉而變成 404 白畫面）。這是「改了程式卻看不到變化」最常見的原因。
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    location /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
