services:
  worker:
    # 容器 log 上限（docs/現版本優化方案.md 0-5）：每個檔 10MB、最多 3 個，不會無限長大塞滿硬碟
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    profiles: ["background"]
    image: python-flask-api:latest
    hostname: flask-api-worker
    # 同時跑幾個任務。每個資料庫的同步是各自一個任務（可以同時跑），再加上每 5 分鐘
    # 的排程心跳也佔一個，所以預設 4；記憶體上限跟著放大（翻譯同步單一任務就要
    # 一百多 MB）。可以用 .env 的 CELERY_WORKER_CONCURRENCY／WORKER_MEMORY_LIMIT 調整。
    command: celery -A celery_worker worker --loglevel=info --concurrency=${CELERY_WORKER_CONCURRENCY:-2}
    env_file: .env
    volumes:
      - ./src:/app/src
      - ./tasks:/app/tasks
      - ./celery_worker.py:/app/celery_worker.py
      - ./conf:/app/conf
      - ./logs:/app/logs
    depends_on:
      # mysql 見 docker-compose.api.yml 同位置的說明
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    # 健康檢查（docs/現版本優化方案.md 3-9）：問這個 worker 自己（celery@hostname）有沒有回 pong；
    # 會另外起一個 python 載入 app，所以間隔放寬
    healthcheck:
      test: ["CMD-SHELL", "celery -A celery_worker inspect ping -d celery@$$HOSTNAME --timeout 10 >/dev/null"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${WORKER_MEMORY_LIMIT:-768m}
        reservations:
          memory: 128m

  beat:
    # 容器 log 上限（docs/現版本優化方案.md 0-5）：每個檔 10MB、最多 3 個，不會無限長大塞滿硬碟
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    profiles: ["background"]
    image: python-flask-api:latest
    hostname: flask-api-beat
    command: celery -A celery_worker beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    env_file: .env
    volumes:
      - ./src:/app/src
      - ./tasks:/app/tasks
      - ./celery_worker.py:/app/celery_worker.py
      - ./conf:/app/conf
    depends_on:
      redis:
        condition: service_healthy
    # 健康檢查：beat 每分鐘都有排程要發（健康檢查任務），排程檔（--schedule）至少幾分鐘會寫一次；
    # 10 分鐘沒動就是卡住了
    healthcheck:
      test: ["CMD-SHELL", "find /tmp -maxdepth 1 -name 'celerybeat-schedule*' -mmin -10 | grep -q ."]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128m
