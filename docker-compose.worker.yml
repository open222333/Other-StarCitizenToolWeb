services:
  worker:
    profiles: ["background"]
    image: python-flask-api:latest
    hostname: flask-api-worker
    command: celery -A celery_worker worker --loglevel=info --concurrency=2
    env_file: .env
    volumes:
      - ./src:/app/src
      - ./tasks:/app/tasks
      - ./celery_worker.py:/app/celery_worker.py
      - ./conf:/app/conf
      - ./logs:/app/logs
    depends_on:
      # mysql 見 docker-compose.api.yml 同位置的說明
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m
        reservations:
          memory: 128m

  beat:
    profiles: ["background"]
    image: python-flask-api:latest
    hostname: flask-api-beat
    command: celery -A celery_worker beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    env_file: .env
    volumes:
      - ./src:/app/src
      - ./tasks:/app/tasks
      - ./celery_worker.py:/app/celery_worker.py
      - ./conf:/app/conf
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128m
