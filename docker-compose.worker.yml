services:
  worker:
    profiles: ["background"]
    image: python-flask-api:latest
    hostname: flask-api-worker
    # 同時跑幾個任務。每個資料庫的同步是各自一個任務（可以同時跑），再加上每 5 分鐘
    # 的排程心跳也佔一個，所以預設 4；記憶體上限跟著放大（翻譯同步單一任務就要
    # 一百多 MB）。可以用 .env 的 CELERY_WORKER_CONCURRENCY／WORKER_MEMORY_LIMIT 調整。
    command: celery -A celery_worker worker --loglevel=info --concurrency=${CELERY_WORKER_CONCURRENCY:-4}
    env_file: .env
    volumes:
      - ./src:/app/src
      - ./tasks:/app/tasks
      - ./celery_worker.py:/app/celery_worker.py
      - ./conf:/app/conf
      - ./logs:/app/logs
    depends_on:
      # mysql 見 docker-compose.api.yml 同位置的說明
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${WORKER_MEMORY_LIMIT:-768m}
        reservations:
          memory: 128m

  beat:
    profiles: ["background"]
    image: python-flask-api:latest
    hostname: flask-api-beat
    command: celery -A celery_worker beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    env_file: .env
    volumes:
      - ./src:/app/src
      - ./tasks:/app/tasks
      - ./celery_worker.py:/app/celery_worker.py
      - ./conf:/app/conf
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128m
