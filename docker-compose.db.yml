# ⚠️ 三個資料庫的 port 一律只綁在 127.0.0.1。
#    Docker 的 port 發佈會直接寫 iptables、**繞過 ufw**，所以寫成
#    "27017:27017" 等於綁 0.0.0.0 —— 主機只要有公網 IP，任何人都能連進來，
#    而 Mongo 目前沒有開 --auth（MONGO_URI 也沒帶帳密）。
#    要從別台機器連，請用 SSH tunnel，不要改成 0.0.0.0。
services:
  mongo:
    image: mongo:7
    hostname: flask-api-mongo
    ports:
      - "${DB_BIND_HOST:-127.0.0.1}:${MONGO_PORT:-27017}:27017"
    volumes:
      - ./docker/database/mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
        reservations:
          memory: 256m

  # ⚠️ mysql 預設不啟動 —— 全專案沒有任何程式 import src.mysql（已 grep 確認），
  #    它是從 Flask 模板繼承下來的服務。跑一個沒人用、又帶著範本密碼
  #    （`root_password` / `flask_password` 是公開在 .env.default 裡的）的資料庫
  #    只是白送一個攻擊面，所以改成要明確指定 profile 才會起：
  #
  #        docker compose --profile mysql up -d mysql
  #
  #    真的要用的時候，.env 的 MYSQL_ROOT_PASSWORD / MYSQL_PASSWORD 必須先填好。
  #
  # ⚠️ 這裡刻意**不用** `${VAR:?訊息}`（required variable）語法，即使它看起來
  #    比較嚴謹：compose 的變數內插發生在 profile 過濾**之前**，所以只要
  #    .env 沒填 MYSQL_*，連 `docker compose ps` / `up -d`（完全不含 mysql）
  #    都會直接報 "required variable ... is missing a value" 而中止 ——
  #    等於一個沒在跑的服務把整個 stack 卡住（已實測確認）。
  #    留空的把關交給 mysql image 自己：沒有密碼它會拒絕初始化並印出原因，
  #    而且只有真的啟用 profile 時才會發生。
  mysql:
    profiles: ["mysql"]
    image: mysql:8.0
    hostname: flask-api-mysql
    ports:
      - "${DB_BIND_HOST:-127.0.0.1}:${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-flask_app}
      MYSQL_USER: ${MYSQL_USER:-flask_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - ./docker/database/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root",
             "--password=${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 384m
        reservations:
          memory: 192m

  redis:
    image: redis:7-alpine
    hostname: flask-api-redis
    ports:
      - "${DB_BIND_HOST:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    # 同樣用 `${VAR:?訊息}`：REDIS_PASSWORD 沒設就中止，不要 fallback 到
    # 公開範本值 `redis_password`（Rate Limiting 與 Celery broker 都在這台上）。
    command: redis-server --requirepass ${REDIS_PASSWORD:?請先在 .env 設定 REDIS_PASSWORD}
    volumes:
      - ./docker/database/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64m
        reservations:
          memory: 32m
